name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev lld
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-accept SDK Licenses & Build
        run: |
          # 1. Pre-seed accepted license hashes for standard Android SDK components
          mkdir -p ~/.android/
          touch ~/.android/repositories.cfg

          # 2. Pre-create buildozer SDK directory and inject accepted license files directly
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n89330d32220b1b34fc6764dd01f40a1676746380\n4544d510120701a57a629ec231b9e25546e1d792\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n8444f7e5728086eaf6e914396b28403b00056f61" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # 3. Run Buildozer with automated agreement flag
          ACCEPT_BUILD_TOOLS_CHECKSUMS=true buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kilobyte-Android-APK
          path: bin/*.apk
