name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev lld
          pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Android SDK Path Structure & Accept Licenses
        run: |
          # 1. Symlink system Android SDK into Buildozer's expected path
          mkdir -p ~/.buildozer/android/platform/
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

          # 2. Fix the legacy path bug by symlinking cmdline-tools to tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # 3. Pre-accept all Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          ACCEPT_BUILD_TOOLS_CHECKSUMS=true buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kilobyte-Android-APK
          path: bin/*.apk
